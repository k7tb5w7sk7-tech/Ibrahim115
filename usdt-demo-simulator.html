<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>USDT Demo Simulator</title>
<style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0b0f14;color:#fff;padding:20px}
.card{max-width:520px;margin:auto;background:#151b22;border:1px solid #2b3440;border-radius:20px;padding:22px}
.badge{display:inline-block;background:#5b2a00;color:#ffbd72;padding:6px 10px;border-radius:20px;font-size:13px}
h1{margin:14px 0 6px}.muted{color:#9da8b5}
.balance{font-size:40px;font-weight:700;margin:20px 0}
input,button{width:100%;box-sizing:border-box;padding:14px;border-radius:12px;font-size:16px}
input{background:#0d1319;border:1px solid #34404d;color:#fff;margin:7px 0}
button{border:0;background:#16a34a;color:#fff;font-weight:700;margin-top:10px}
.tx{margin-top:18px;padding:14px;background:#0d1319;border-radius:12px}
.warn{margin-top:18px;padding:12px;border-radius:12px;background:#24170d;color:#ffc27a;font-size:13px}
</style>
</head>
<body>
<div class="card">
  <span class="badge">DEMO / SIMULATION — NOT REAL USDT</span>
  <h1>محاكي USDT</h1>
  <div class="muted">تجربة محلية فقط — لا توجد معاملات بلوكتشين حقيقية</div>
  <div class="balance" id="balance">10,000.00 USDT</div>

  <input id="address" placeholder="عنوان تجريبي (غير حقيقي)">
  <input id="amount" type="number" min="0" step="0.01" placeholder="المبلغ">
  <button onclick="send()">محاكاة إرسال</button>

  <div id="result"></div>
  <div class="warn">هذا التطبيق للعرض والتجربة فقط. لا ينشئ USDT حقيقيًا ولا يتصل بأي محفظة أو شبكة.</div>
</div>
<script>
let balance=10000;
function send(){
  const address=document.getElementById('address').value.trim();
  const amount=Number(document.getElementById('amount').value);
  const result=document.getElementById('result');
  if(!address || !amount || amount<=0){result.innerHTML='<div class="tx">اكتب عنوانًا تجريبيًا ومبلغًا صحيحًا.</div>';return;}
  if(amount>balance){result.innerHTML='<div class="tx">الرصيد التجريبي غير كافٍ.</div>';return;}
  balance-=amount;
  document.getElementById('balance').textContent=balance.toLocaleString('en-US',{minimumFractionDigits:2})+' USDT';
  result.innerHTML='<div class="tx">✅ تمت محاكاة العملية فقط<br>المبلغ: '+amount.toFixed(2)+' USDT<br>العنوان: '+address+'<br><span class="muted">لا توجد معاملة حقيقية على البلوكتشين.</span></div>';
}
</script>
</body>
</html>
